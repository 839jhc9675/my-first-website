<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>나의 첫 번째 웹사이트</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: 'Pretendard', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); color: #333; padding: 16px;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 48px 32px; max-width: 480px; width: 100%;
      text-align: center; box-shadow: 0 20px 40px rgba(0, 0, 0, 0.15);
    }
    .emoji { font-size: 4rem; margin-bottom: 8px; }
    h1 { margin: 0 0 12px; font-size: 2rem; color: #4c3a8f; }
    p { margin: 0 0 24px; line-height: 1.6; color: #666; }
    .btn {
      display: inline-block; padding: 12px 28px; border-radius: 999px; background: #667eea;
      color: #fff; text-decoration: none; font-weight: bold; transition: background 0.2s;
    }
    .btn:hover { background: #764ba2; }
    @media (max-width: 600px) {
      .card { padding: 32px 20px; }
      h1 { font-size: 1.5rem; }
      .emoji { font-size: 3rem; }
    }
  </style>
</head>
<body>
  <main class="card">
    <div class="emoji">👋</div>
    <h1>환영합니다!</h1>
    <p>안녕하세요, 바이브코딩으로 웹 개발을 배우고 있습니다.<br>
      이 페이지는 GitHub Pages로 배포된 나의 첫 번째 웹사이트예요.</p>
    <a class="btn" href="https://github.com/839jhc9675/my-first-website">GitHub 저장소 보기</a>
  </main>
</body>
</html>
